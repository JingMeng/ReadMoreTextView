apply plugin: 'com.android.library'
android {
    namespace 'com.borjabravo.readmoretextview'
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.12'
}
